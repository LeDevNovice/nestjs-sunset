name: Bug report
description: Something isn't working as documented
labels: ['bug', 'triage']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this report.
        Please search [existing issues](https://github.com/LeDevNovice/nestjs-sunset/issues)
        before opening a new one.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: 'When I add @Deprecated() to a handler, the Sunset header is missing...'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A **minimal** code snippet that reproduces the issue.
        The simpler the better - strip everything unrelated.
      render: typescript
      placeholder: |
        @Deprecated({ sunset: new Date('2026-01-01') })
        @Get('v1/old')
        async oldHandler() { return {}; }
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Paste error messages and stack traces here.
    validations:
      required: true

  - type: input
    id: nestjs-sunset-version
    attributes:
      label: nestjs-sunset version
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: nestjs-version
    attributes:
      label: NestJS version
      placeholder: '11.x'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: '20.x'
    validations:
      required: true

  - type: dropdown
    id: http-adapter
    attributes:
      label: HTTP adapter
      options:
        - Express (default)
        - Fastify
        - Other
    validations:
      required: true
