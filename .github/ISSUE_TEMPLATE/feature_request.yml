name: Feature request
description: Suggest an improvement or new capability
labels: ['enhancement', 'triage']

body:
  - type: markdown
    attributes:
      value: |
        Before requesting a feature, check the [open issues](https://github.com/LeDevNovice/nestjs-sunset/issues).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the problem you're trying to solve.
        "I'm frustrated when..." framing works well here.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Include a code example if possible.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches you've thought about or tried.
