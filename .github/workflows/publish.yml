name: Publish to npm

# Trigger on GitHub Release published event
# Create the release in GitHub UI (with changelog notes), THEN it publishes.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate package exports and types
        run: npm run lint:pkg

      - name: Run tests
        run: npm run test

      - name: Publish with provenance attestation
        # --provenance attaches a signed Sigstore attestation: cryptographic
        # proof linking this release to this commit + workflow.
        # Consumers verify with: npm audit signatures nestjs-sunset
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: 'true'
